<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Quizzes - StudyPilot AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">
    <div id="header-placeholder"></div>

    <main class="container dashboard-main">
        <!-- ქვიზების სიის სექცია -->
        <div class="dashboard-card" id="quizzesListSection">
            <h2>My Generated Quizzes</h2>
            <p class="section-desc">Select a quiz from the list to view questions and take the test.</p>
            <div id="quizzesContainer" class="quizzes-grid">
                <p class="empty-text">You don't have any generated quizzes yet.</p>
            </div>
        </div>

        <div class="dashboard-card" id="singleQuizView" style="display: none;">
            <button type="button" id="backToListBtn" class="btn-outline" style="margin-bottom: 20px;">← Back to List</button>
            <h2 id="activeQuizTitle">Quiz Title</h2>
            <div id="activeQuizQuestions"></div>
        </div>
    </main>

    <script src="js/navbar.js"></script>
    <script src="js/quizzes.js"></script>
</body>
</html>
