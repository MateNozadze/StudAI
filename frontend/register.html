<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>რეგისტრაცია - StudyPilot AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand-logo">StudyPilot AI</div>
            <p class="auth-subtitle">შექმენი ახალი ანგარიში</p>

            <div id="alertBox" class="alert"></div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="username">ექაუნთის სახელი</label>
                    <input type="text" id="username" class="form-control" placeholder="სახელი" required>
                </div>

                <div class="form-group">
                    <label for="email">ელ-ფოსტა</label>
                    <input type="email" id="email" class="form-control" placeholder="student@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">პაროლი</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="მინიმუმ 6 სიმბოლო" required>
                        <button type="button" class="toggle-password" data-target="password" title="პაროლის ჩვენება">🫣</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">გაიმეორე პაროლი</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" data-target="confirmPassword" title="პაროლის ჩვენება">🫣</button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary">რეგისტრაცია</button>
            </form>

            <div class="auth-footer">
                უკვე გაქვს ანგარიში? <a href="login.html">შესვლა</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
