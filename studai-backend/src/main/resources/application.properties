spring.application.name=studai-backend

# ბაზის კონფიგურაცია (Docker-ში იღებს db კონტეინერს, ლოკალურად localhost-ს)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studai_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT კონფიგურაცია
app.jwt.secret=${APP_JWT_SECRET:9a4f2c8d3b7a1e6f4c8a9d2b3c4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4}
app.jwt.expiration-milliseconds=86400000

# Python AI სერვისის მისამართი (Docker-ში იქნება http://ai-service:8000)
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}

# ლოგირება (სურვილისამებრ TRACE შეგიძლია INFO-ზე ჩამოწიო, რომ კონსოლი ძალიან არ გადატვირთოს)
logging.level.ge.mate.studai_backend.config=DEBUG
logging.level.org.springframework.security=INFO